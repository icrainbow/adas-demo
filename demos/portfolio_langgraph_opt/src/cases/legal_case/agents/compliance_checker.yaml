inputs:
- clause_inventory
- policy_notes
outputs:
- compliance_findings
token_budget_hint: 1800
name: Compliance Checker
description: Check the extracted clauses against generic policy notes and flag missing/weak
  protections; ensure findings are evidence-grounded.
