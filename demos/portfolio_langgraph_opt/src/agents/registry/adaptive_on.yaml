id: adaptive_on
version: 1.0.0
stage: strategy
node_type: policy
enabled_by_default: false
description: "Adaptive subgraphs enabled - dynamic topology based on case signals"
params:
  adaptive_enabled: true
  available_subgraphs:
    - liquidity
    - concentration
    - leverage
    - suitability
constraints:
  requires: ["risk_decompose"]
  requires_any: []
  mutex_with: ["adaptive_off"]
  only_with: []
  at_most_one_group: "adaptive"
ordering:
  priority: 300
  depends_on: []
  before: []
cost_hint:
  tokens_per_case: 100
  relative_latency: 1.5
  complexity: "high"
